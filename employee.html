<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form - Beta Tech Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .required {
            color: #e74c3c;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .form-header h1 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-header">
            <h1>Employee Registration Form</h1>
            <p>Beta Tech Solutions Ltd - Musanze District</p>
        </div>

        <div class="success-message" id="successMessage">
            Employee registered successfully! Welcome to Beta Tech Solutions.
        </div>

        <form id="employeeForm" onsubmit="handleSubmit(event)">
            <!-- Personal Information Section -->
            <div class="form-row full">
                <h3 style="color: #667eea; margin-bottom: 15px;">Personal Information</h3>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" name="fullName" required placeholder="Enter full name">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="employeeId">Employee ID <span class="required">*</span></label>
                    <input type="text" id="employeeId" name="employeeId" required placeholder="e.g., EMP-2026-001">
                </div>
                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth <span class="required">*</span></label>
                    <input type="date" id="dateOfBirth" name="dateOfBirth" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="gender">Gender <span class="required">*</span></label>
                    <select id="gender" name="gender" required>
                        <option value="">Select gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nationalId">National ID <span class="required">*</span></label>
                    <input type="text" id="nationalId" name="nationalId" required placeholder="Enter national ID number">
                </div>
            </div>

            <!-- Contact Information Section -->
            <div class="form-row full">
                <h3 style="color: #667eea; margin-bottom: 15px; margin-top: 20px;">Contact Information</h3>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" required placeholder="+250 XXX XXX XXX">
                </div>
            </div>

            <div class="form-group">
                <label for="address">Home Address <span class="required">*</span></label>
                <input type="text" id="address" name="address" required placeholder="Street, City, Province">
            </div>

            <!-- Employment Details Section -->
            <div class="form-row full">
                <h3 style="color: #667eea; margin-bottom: 15px; margin-top: 20px;">Employment Details</h3>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="position">Position/Job Title <span class="required">*</span></label>
                    <input type="text" id="position" name="position" required placeholder="e.g., Software Developer">
                </div>
                <div class="form-group">
                    <label for="department">Department <span class="required">*</span></label>
                    <select id="department" name="department" required>
                        <option value="">Select department</option>
                        <option value="it">Information Technology</option>
                        <option value="hr">Human Resources</option>
                        <option value="finance">Finance</option>
                        <option value="marketing">Marketing</option>
                        <option value="operations">Operations</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="startDate">Start Date <span class="required">*</span></label>
                    <input type="date" id="startDate" name="startDate" required>
                </div>
                <div class="form-group">
                    <label for="salary">Monthly Salary (RWF) <span class="required">*</span></label>
                    <input type="number" id="salary" name="salary" required placeholder="0.00" min="0" step="0.01">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="manager">Manager/Supervisor</label>
                    <input type="text" id="manager" name="manager" placeholder="Enter manager's name">
                </div>
                <div class="form-group">
                    <label for="employmentType">Employment Type <span class="required">*</span></label>
                    <select id="employmentType" name="employmentType" required>
                        <option value="">Select type</option>
                        <option value="full-time">Full-time</option>
                        <option value="part-time">Part-time</option>
                        <option value="contract">Contract</option>
                        <option value="intern">Intern</option>
                    </select>
                </div>
            </div>

            <!-- Emergency Contact Section -->
            <div class="form-row full">
                <h3 style="color: #667eea; margin-bottom: 15px; margin-top: 20px;">Emergency Contact</h3>
            </div>

            <div class="form-group">
                <label for="emergencyName">Emergency Contact Name <span class="required">*</span></label>
                <input type="text" id="emergencyName" name="emergencyName" required placeholder="Enter emergency contact name">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="emergencyPhone">Emergency Contact Phone <span class="required">*</span></label>
                    <input type="tel" id="emergencyPhone" name="emergencyPhone" required placeholder="+250 XXX XXX XXX">
                </div>
                <div class="form-group">
                    <label for="emergencyRelation">Relationship <span class="required">*</span></label>
                    <input type="text" id="emergencyRelation" name="emergencyRelation" required placeholder="e.g., Parent, Spouse">
                </div>
            </div>

            <!-- Additional Information Section -->
            <div class="form-row full">
                <h3 style="color: #667eea; margin-bottom: 15px; margin-top: 20px;">Additional Information</h3>
            </div>

            <div class="form-group">
                <label for="qualifications">Qualifications/Education</label>
                <textarea id="qualifications" name="qualifications" placeholder="List educational background and qualifications"></textarea>
            </div>

            <div class="form-group">
                <label for="experience">Previous Work Experience</label>
                <textarea id="experience" name="experience" placeholder="Describe previous work experience"></textarea>
            </div>

            <div class="form-group">
                <label for="specialNotes">Special Notes or Comments</label>
                <textarea id="specialNotes" name="specialNotes" placeholder="Add any additional information"></textarea>
            </div>

            <!-- Buttons -->
            <div class="form-row full">
                <button type="submit">Register Employee</button>
                <button type="reset" style="background: #95a5a6;">Clear Form</button>
            </div>
        </form>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();

            // Get form data
            const formData = new FormData(document.getElementById('employeeForm'));
            const data = Object.fromEntries(formData);

            // Log the data (in real application, this would be sent to a server)
            console.log('Employee Registration Data:', data);

            // Show success message
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';

            // Reset form after 3 seconds
            setTimeout(() => {
                document.getElementById('employeeForm').reset();
                successMessage.style.display = 'none';
            }, 3000);
        }

        // Add form validation
        document.getElementById('employeeForm').addEventListener('change', function(e) {
            if (e.target.type === 'email') {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(e.target.value) && e.target.value !== '') {
                    e.target.style.borderColor = '#e74c3c';
                } else {
                    e.target.style.borderColor = '#ddd';
                }
            }
        });
    </script>
</body>
</html>
